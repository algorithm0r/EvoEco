<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EvoEco</title>
  <!-- Claude Basic, vendored and pinned (the version is in each file's header line) -->
  <link rel="stylesheet" href="vendor/claude-basic/claude-basic.css">
  <script src="vendor/claude-basic/claude-basic.js"></script>
  <style>
    /* page-only: the top line. Everything under it is the kit's sim layout. */
    .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px var(--cb-gap) 0; }
    .top .spacer { flex: 1; }
    .top h1 { margin: 0; font-size: 20px; }
    .top .note { color: var(--cb-muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="top">
    <h1 class="cb-title">EvoEco<span class="cb-dot">.</span></h1>
    <span class="note">the foundation economy · Claude Basic <span id="ver"></span></span>
    <span class="spacer"></span>
    <span id="picker"></span>
  </div>

  <div class="cb-sim">
    <div class="cb-sim-stage">
      <div class="cb-sim-world"><canvas id="gameWorld" width="900" height="684"></canvas></div>
      <div class="cb-sim-bar">
        <cb-sim-clock id="clock" count size="84" cycle-label="year" unit-label="day"></cb-sim-clock>
        <div id="legend"></div>
      </div>
      <div id="controls"></div>
      <div id="view"></div>
    </div>

    <div class="cb-sim-charts">
      <cb-sim-series id="pop" label="Population" x-label="day"></cb-sim-series>
      <cb-sim-series id="needs" label="Mean need levels" y-min="-1" y-max="1" x-label="day"></cb-sim-series>
      <cb-sim-series id="camps" label="Camps" x-label="day"></cb-sim-series>
      <cb-sim-series id="shelter" label="Shelter" x-label="day"></cb-sim-series>
      <cb-sim-series id="exchange" label="Exchange, a day" x-label="day"></cb-sim-series>
      <cb-sim-series id="grain" label="Grain, a day" x-label="day"></cb-sim-series>
      <cb-sim-series id="farmers" label="Farming" x-label="day"></cb-sim-series>
      <cb-sim-series id="farmReturn" label="Planters' learned return" x-label="day"></cb-sim-series>
      <cb-sim-series id="know" label="Know-how found" x-label="day"></cb-sim-series>
      <cb-sim-series id="knowers" label="Who knows" x-label="day"></cb-sim-series>
      <div class="cb-sim-group" style="--cols:3">
        <div class="cb-label">Distributions across the living</div>
        <cb-sim-histmap id="dFood" label="Food level" lo="-1" hi="1" x-label="day"></cb-sim-histmap>
        <cb-sim-histmap id="dWater" label="Water level" lo="-1" hi="1" x-label="day"></cb-sim-histmap>
        <cb-sim-histmap id="dWarmth" label="Warmth level" lo="-1" hi="1" x-label="day"></cb-sim-histmap>
        <cb-sim-histmap id="dRest" label="Rest" lo="0" hi="1" x-label="day" color="var(--cb-series-2)"></cb-sim-histmap>
        <cb-sim-histmap id="dBelonging" label="Belonging" lo="0" hi="1" x-label="day" color="var(--cb-series-3)"></cb-sim-histmap>
      </div>
    </div>
  </div>

  <!-- socket.io client (for the standard DB client in socket mode) -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <!-- sim core, in dependency order; main.js last -->
  <script src="src/util.js"></script>
  <script src="src/params.js"></script>
  <script src="src/db.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/hex.js"></script>
  <script src="src/mapgen.js"></script>
  <script src="src/agent.js"></script>
  <script src="src/tree.js"></script>
  <script src="src/planner.js"></script>
  <script src="src/exchange.js"></script>
  <script src="src/world.js"></script>
  <script src="src/observer.js"></script>
  <script src="src/datamanager.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
